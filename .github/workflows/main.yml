name: Build and Release YTMusicUltimate
on:
  workflow_dispatch:
    inputs: 
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

      changelog:
        description: "Release changelog (optional; recent commits are used when empty)"
        default: ""
        required: false
        type: string

      create_release:
        description: "Create a draft GitHub release"
        default: false
        required: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Install Dependencies
        run: brew install make ldid pipx

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download YouTube Music
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail

          url="$IPA_URL"
          if [[ "$url" =~ drive\.google\.com/file/d/([^/]+) ]]; then
            url="https://drive.google.com/uc?export=download&id=${BASH_REMATCH[1]}"
          fi

          curl -L --fail --retry 3 --retry-delay 2 -c cookies.txt -b cookies.txt "$url" -o ytm.ipa
          file_type=$(file --mime-type -b ytm.ipa)
          if [[ "$file_type" == "text/html" ]] && grep -qi "Google Drive" ytm.ipa; then
            confirm_url=$(python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlencode

          class DownloadFormParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_download_form = False
                  self.action = ""
                  self.inputs = {}

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "form" and attrs.get("id") == "download-form":
                      self.in_download_form = True
                      self.action = attrs.get("action", "")
                  elif tag == "input" and self.in_download_form:
                      name = attrs.get("name")
                      if name:
                          self.inputs[name] = attrs.get("value", "")

              def handle_endtag(self, tag):
                  if tag == "form":
                      self.in_download_form = False

          parser = DownloadFormParser()
          parser.feed(Path("ytm.ipa").read_text(errors="replace"))
          if not parser.action or not parser.inputs:
              raise SystemExit("Google Drive confirmation form not found")
          print(f"{parser.action}?{urlencode(parser.inputs)}")
          PY
          )
            curl -L --fail --retry 3 --retry-delay 2 -b cookies.txt "$confirm_url" -o ytm.ipa
          fi

      - name: Validate IPA
        run: |
          file_type=$(file --mime-type -b ytm.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The file is not a valid IPA file. Detected type: $file_type."
            exit 1
          fi

      - name: Build and Inject Tweak
        run: |
          cd main
          THEOS="${{ github.workspace }}/theos" CYAN=cyan scripts/build_sideload_ipa.sh \
            ../ytm.ipa \
            ../YTMusicUltimate.ipa \
            "${{ inputs.display_name }}" \
            "${{ inputs.bundle_id }}"

      - name: Summarize IPA
        id: ipa
        run: |
          set -euo pipefail
          echo "sha256=$(shasum -a 256 YTMusicUltimate.ipa | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -f%z YTMusicUltimate.ipa)" >> "$GITHUB_OUTPUT"

      - name: Upload IPA Artifact
        id: upload_ipa
        uses: actions/upload-artifact@v7.0.1
        with:
          name: YTMusicUltimate-${{ github.run_number }}
          path: YTMusicUltimate.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Notes
        env:
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          if [[ -n "$CHANGELOG" ]]; then
            printf "%s\n" "$CHANGELOG" > RELEASE_NOTES.md
          else
            {
              echo "### Changes"
              git -C main log --pretty=format:'- %s (`%h`)' -20
              echo
            } > RELEASE_NOTES.md
          fi
          {
            echo
            echo "### Build"
            echo "- Workflow run: ${{ github.run_number }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- IPA size: ${{ steps.ipa.outputs.size }} bytes"
            echo "- SHA-256: \`${{ steps.ipa.outputs.sha256 }}\`"
            echo "- Action artifact: ${{ steps.upload_ipa.outputs.artifact-url }}"
          } >> RELEASE_NOTES.md

      - name: Create Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ytmusicultimate-action-${{ github.run_number }}
          name: YTMusicUltimate (${{ github.run_number }})
          body_path: RELEASE_NOTES.md
          files: YTMusicUltimate.ipa
          draft: true

      - name: Output Release URL
        if: ${{ inputs.create_release }}
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"

      - name: Output Artifact URL
        if: ${{ !inputs.create_release }}
        run: |
          echo "::notice::Build artifact available at: ${{ steps.upload_ipa.outputs.artifact-url }}"
